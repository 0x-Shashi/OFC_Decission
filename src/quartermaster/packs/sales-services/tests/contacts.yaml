# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.cx.contacts
title: "Contacts: the service answers and returns the fields integrations rely on"
module: CX
product: Sales
process: Contacts
priority: medium
tags: [library, sales-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Contacts service answers and lists records
    value: GET /crmRestApi/resources/11.13.18.05/contacts?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].PartyId": "*"
        "items[0].PartyNumber": "*"
        "items[0].ContactName": "*"
