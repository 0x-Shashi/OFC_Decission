# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.cx.service-requests
title: "Service requests: the service answers and returns the fields integrations rely on"
module: CX
product: Service
process: Service Requests
priority: medium
tags: [library, sales-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Service requests service answers and lists records
    value: GET /crmRestApi/resources/11.13.18.05/serviceRequests?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].SrId": "*"
        "items[0].SrNumber": "*"
        "items[0].Title": "*"
