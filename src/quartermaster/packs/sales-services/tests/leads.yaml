# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.cx.leads
title: "Sales leads: the service answers and returns the fields integrations rely on"
module: CX
product: Sales
process: Leads
priority: medium
tags: [library, sales-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Sales leads service answers and lists records
    value: GET /crmRestApi/resources/11.13.18.05/leads?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].LeadId": "*"
        "items[0].LeadNumber": "*"
        "items[0].Name": "*"
        "items[0].StatusCode": "*"
      save:
        first_id: items[0].LeadId
  - action: api_call
    intent: One record of Sales leads can be read by its id
    value: GET /crmRestApi/resources/11.13.18.05/leads/${first_id}?onlyData=true
    options:
      check:
        "LeadId": "*"
