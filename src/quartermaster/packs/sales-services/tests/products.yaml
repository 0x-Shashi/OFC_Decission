# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.cx.products
title: "Sales products: the service answers and returns the fields integrations rely on"
module: CX
product: Sales
process: Products
priority: medium
tags: [library, sales-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Sales products service answers and lists records
    value: GET /crmRestApi/resources/11.13.18.05/products?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].InventoryItemId": "*"
        "items[0].ItemNumber": "*"
      save:
        first_id: items[0].InventoryItemId
  - action: api_call
    intent: One record of Sales products can be read by its id
    value: GET /crmRestApi/resources/11.13.18.05/products/${first_id}?onlyData=true
    options:
      check:
        "InventoryItemId": "*"
