# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.receivables-receipts
title: "Standard receipts: the service answers and returns the fields integrations rely on"
module: Financials
product: Receivables
process: Receipts
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Standard receipts service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/standardReceipts?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].StandardReceiptId": "*"
        "items[0].ReceiptNumber": "*"
        "items[0].Amount": "*"
      save:
        first_id: items[0].StandardReceiptId
  - action: api_call
    intent: One record of Standard receipts can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/standardReceipts/${first_id}?onlyData=true
    options:
      check:
        "StandardReceiptId": "*"
