# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.projects
title: "Projects: the service answers and returns the fields integrations rely on"
module: Financials
product: Project Management
process: Projects
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Projects service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/projects?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].ProjectId": "*"
        "items[0].ProjectNumber": "*"
        "items[0].ProjectName": "*"
        "items[0].ProjectStatus": "*"
      save:
        first_id: items[0].ProjectId
  - action: api_call
    intent: One record of Projects can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/projects/${first_id}?onlyData=true
    options:
      check:
        "ProjectId": "*"
