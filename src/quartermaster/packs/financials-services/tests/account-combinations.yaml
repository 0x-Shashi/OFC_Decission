# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.account-combinations
title: "Account combinations (list of values): the service answers and returns the fields integrations rely on"
module: Financials
product: General Ledger
process: Chart of Accounts
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Account combinations (list of values) service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/accountCombinationsLOV?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].EnabledFlag": "*"
        "items[0].AccountType": "*"
