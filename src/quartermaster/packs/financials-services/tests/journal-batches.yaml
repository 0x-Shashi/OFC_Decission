# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.journal-batches
title: "Journal batches: the service answers and returns the fields integrations rely on"
module: Financials
product: General Ledger
process: Journals
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Journal batches service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/journalBatches?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].JeBatchId": "*"
        "items[0].BatchName": "*"
        "items[0].Status": "*"
        "items[0].DefaultPeriodName": "*"
      save:
        first_id: items[0].JeBatchId
  - action: api_call
    intent: One record of Journal batches can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/journalBatches/${first_id}?onlyData=true
    options:
      check:
        "JeBatchId": "*"
