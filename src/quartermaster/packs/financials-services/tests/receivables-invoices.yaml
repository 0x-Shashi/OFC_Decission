# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.receivables-invoices
title: "Receivables invoices: the service answers and returns the fields integrations rely on"
module: Financials
product: Receivables
process: Transactions
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Receivables invoices service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/receivablesInvoices?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].CustomerTransactionId": "*"
        "items[0].TransactionNumber": "*"
        "items[0].BillToCustomerName": "*"
        "items[0].InvoiceCurrencyCode": "*"
      save:
        first_id: items[0].CustomerTransactionId
  - action: api_call
    intent: One record of Receivables invoices can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/receivablesInvoices/${first_id}?onlyData=true
    options:
      check:
        "CustomerTransactionId": "*"
