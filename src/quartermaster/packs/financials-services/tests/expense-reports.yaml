# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.fin.expense-reports
title: "Expense reports: the service answers and returns the fields integrations rely on"
module: Financials
product: Expenses
process: Expense Reports
priority: medium
tags: [library, financials-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Expense reports service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/expenseReports?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].ExpenseReportId": "*"
        "items[0].ExpenseReportNumber": "*"
        "items[0].ExpenseReportStatus": "*"
      save:
        first_id: items[0].ExpenseReportId
  - action: api_call
    intent: One record of Expense reports can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/expenseReports/${first_id}?onlyData=true
    options:
      check:
        "ExpenseReportId": "*"
