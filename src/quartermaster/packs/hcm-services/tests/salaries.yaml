# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.hcm.salaries
title: "Salaries: the service answers and returns the fields integrations rely on"
module: HCM
product: Workforce Compensation
process: Salary
priority: medium
tags: [library, hcm-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Salaries service answers and lists records
    value: GET /hcmRestApi/resources/11.13.18.05/salaries?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].SalaryId": "*"
        "items[0].AssignmentId": "*"
        "items[0].AssignmentNumber": "*"
        "items[0].CurrencyCode": "*"
      save:
        first_id: items[0].SalaryId
  - action: api_call
    intent: One record of Salaries can be read by its id
    value: GET /hcmRestApi/resources/11.13.18.05/salaries/${first_id}?onlyData=true
    options:
      check:
        "SalaryId": "*"
