# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.hcm.checklists
title: "Allocated checklists: the service answers and returns the fields integrations rely on"
module: HCM
product: Global Human Resources
process: Checklists
priority: medium
tags: [library, hcm-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Allocated checklists service answers and lists records
    value: GET /hcmRestApi/resources/11.13.18.05/allocatedChecklists?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].AllocatedChecklistId": "*"
        "items[0].ChecklistCode": "*"
        "items[0].ChecklistName": "*"
        "items[0].ChecklistStatus": "*"
      save:
        first_id: items[0].AllocatedChecklistId
  - action: api_call
    intent: One record of Allocated checklists can be read by its id
    value: GET /hcmRestApi/resources/11.13.18.05/allocatedChecklists/${first_id}?onlyData=true
    options:
      check:
        "AllocatedChecklistId": "*"
