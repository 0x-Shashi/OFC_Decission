# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.hcm.goal-plans
title: "Goal plans: the service answers and returns the fields integrations rely on"
module: HCM
product: Goals and Performance
process: Goal Plans
priority: medium
tags: [library, hcm-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Goal plans service answers and lists records
    value: GET /hcmRestApi/resources/11.13.18.05/goalPlans?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].GoalPlanId": "*"
        "items[0].GoalPlanName": "*"
        "items[0].GoalPlanExternalId": "*"
      save:
        first_id: items[0].GoalPlanId
  - action: api_call
    intent: One record of Goal plans can be read by its id
    value: GET /hcmRestApi/resources/11.13.18.05/goalPlans/${first_id}?onlyData=true
    options:
      check:
        "GoalPlanId": "*"
