# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.hcm.documents-of-record
title: "Documents of record: the service answers and returns the fields integrations rely on"
module: HCM
product: Global Human Resources
process: Documents of Record
priority: medium
tags: [library, hcm-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Documents of record service answers and lists records
    value: GET /hcmRestApi/resources/11.13.18.05/documentRecords?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].DocumentsOfRecordId": "*"
        "items[0].DocumentTypeId": "*"
      save:
        first_id: items[0].DocumentsOfRecordId
  - action: api_call
    intent: One record of Documents of record can be read by its id
    value: GET /hcmRestApi/resources/11.13.18.05/documentRecords/${first_id}?onlyData=true
    options:
      check:
        "DocumentsOfRecordId": "*"
