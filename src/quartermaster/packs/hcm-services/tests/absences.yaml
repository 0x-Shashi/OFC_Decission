# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.hcm.absences
title: "Absence entries: the service answers and returns the fields integrations rely on"
module: HCM
product: Absence Management
process: Absences
priority: medium
tags: [library, hcm-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Absence entries service answers and lists records
    value: GET /hcmRestApi/resources/11.13.18.05/absences?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].personAbsenceEntryId": "*"
        "items[0].absenceTypeId": "*"
      save:
        first_id: items[0].personAbsenceEntryId
  - action: api_call
    intent: One record of Absence entries can be read by its id
    value: GET /hcmRestApi/resources/11.13.18.05/absences/${first_id}?onlyData=true
    options:
      check:
        "personAbsenceEntryId": "*"
