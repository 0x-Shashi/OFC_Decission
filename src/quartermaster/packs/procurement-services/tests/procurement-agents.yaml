# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.pro.procurement-agents
title: "Procurement agents: the service answers and returns the fields integrations rely on"
module: Procurement
product: Purchasing
process: Procurement Agents
priority: medium
tags: [library, procurement-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Procurement agents service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/procurementAgents?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].AgentId": "*"
        "items[0].ProcurementBUId": "*"
        "items[0].ProcurementBU": "*"
      save:
        first_id: items[0].AssignmentId
  - action: api_call
    intent: One record of Procurement agents can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/procurementAgents/${first_id}?onlyData=true
    options:
      check:
        "AssignmentId": "*"
