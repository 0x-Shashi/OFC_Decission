# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.pro.purchase-orders
title: "Purchase orders: the service answers and returns the fields integrations rely on"
module: Procurement
product: Purchasing
process: Purchase Orders
priority: medium
tags: [library, procurement-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Purchase orders service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/purchaseOrders?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].POHeaderId": "*"
        "items[0].OrderNumber": "*"
        "items[0].Supplier": "*"
        "items[0].Status": "*"
      save:
        first_id: items[0].POHeaderId
  - action: api_call
    intent: One record of Purchase orders can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/purchaseOrders/${first_id}?onlyData=true
    options:
      check:
        "POHeaderId": "*"
