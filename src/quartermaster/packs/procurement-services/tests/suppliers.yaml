# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.pro.suppliers
title: "Suppliers: the service answers and returns the fields integrations rely on"
module: Procurement
product: Supplier Model
process: Suppliers
priority: medium
tags: [library, procurement-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Suppliers service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/suppliers?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].SupplierId": "*"
        "items[0].Supplier": "*"
        "items[0].SupplierNumber": "*"
      save:
        first_id: items[0].SupplierId
  - action: api_call
    intent: One record of Suppliers can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/suppliers/${first_id}?onlyData=true
    options:
      check:
        "SupplierId": "*"
