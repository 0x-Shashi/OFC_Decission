# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.scm.units-of-measure
title: "Units of measure: the service answers and returns the fields integrations rely on"
module: SCM
product: Inventory Management
process: Units of Measure
priority: medium
tags: [library, supply-chain-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Units of measure service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/unitsOfMeasure?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].UOMId": "*"
        "items[0].UOMCode": "*"
        "items[0].UOMClassCode": "*"
