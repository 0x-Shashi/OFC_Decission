# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.scm.shipments
title: "Shipments (receiving): the service answers and returns the fields integrations rely on"
module: SCM
product: Receiving
process: Shipments
priority: medium
tags: [library, supply-chain-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Shipments (receiving) service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/shipments?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].ASNStatus": "*"
        "items[0].DeliveryId": "*"
        "items[0].WeightUOMCode": "*"
      save:
        first_id: items[0].DeliveryId
  - action: api_call
    intent: One record of Shipments (receiving) can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/shipments/${first_id}?onlyData=true
    options:
      check:
        "DeliveryId": "*"
