# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.scm.calendars
title: "Calendars: the service answers and returns the fields integrations rely on"
module: SCM
product: Manufacturing
process: Calendars
priority: medium
tags: [library, supply-chain-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Calendars service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/calendars?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].CalendarCode": "*"
        "items[0].CalendarCodeName": "*"
      save:
        first_id: items[0].CalendarCode
  - action: api_call
    intent: One record of Calendars can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/calendars/${first_id}?onlyData=true
    options:
      check:
        "CalendarCode": "*"
