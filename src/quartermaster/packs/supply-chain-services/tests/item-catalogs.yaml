# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.scm.item-catalogs
title: "Item catalogs: the service answers and returns the fields integrations rely on"
module: SCM
product: Product Hub
process: Catalogs
priority: medium
tags: [library, supply-chain-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Item catalogs service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/itemCatalogs?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].CatalogId": "*"
        "items[0].CatalogCode": "*"
        "items[0].CatalogName": "*"
      save:
        first_id: items[0].CatalogId
  - action: api_call
    intent: One record of Item catalogs can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/itemCatalogs/${first_id}?onlyData=true
    options:
      check:
        "CatalogId": "*"
