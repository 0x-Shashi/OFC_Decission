# Quartermaster test library. Read only: it only asks the pod questions (GET), it never changes anything.
# The pod this was checked on had records here, so the fields below are required.
id: lib.scm.work-orders
title: "Work orders: the service answers and returns the fields integrations rely on"
module: SCM
product: Manufacturing
process: Work Orders
priority: medium
tags: [library, supply-chain-services, rest, read-only]
estimated_minutes: 0.5
steps:
  - action: api_call
    intent: The Work orders service answers and lists records
    value: GET /fscmRestApi/resources/11.13.18.05/workOrders?limit=1&onlyData=true
    options:
      check:
        count: "*"
        hasMore: "*"
        "items[0].WorkOrderId": "*"
        "items[0].WorkOrderNumber": "*"
        "items[0].WorkOrderStatusCode": "*"
      save:
        first_id: items[0].WorkOrderId
  - action: api_call
    intent: One record of Work orders can be read by its id
    value: GET /fscmRestApi/resources/11.13.18.05/workOrders/${first_id}?onlyData=true
    options:
      check:
        "WorkOrderId": "*"
