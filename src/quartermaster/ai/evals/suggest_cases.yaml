# Golden cases for the AI that suggests what a missing button, link or field became (runner/suggest.py).
# Each case is a step that could not find its item, the screen it was looking at (all made up: no pod text), and
# what a careful person would answer:
#   expect: {pick: [names that are right]}   one of these is the item under a new name
#   expect: {none: true}                     the item is not on this screen; the AI must say so
# A wrong pick (anything else) is the harmful answer: it would send the person to the wrong control.
- id: renamed-button
  step:
    action: click
    intent: Start creating a new worker
    expected: The Add Worker page opens
    target: {strategies: [{role: "button:Create Worker"}, {text: "Create Worker"}]}
  screen:
    - {role: button, name: Add Worker}
    - {role: button, name: Cancel}
    - {role: link, name: Home}
  expect: {pick: [Add Worker]}

- id: punctuation-in-a-field
  step:
    action: fill
    intent: Type the name to search for
    value: Patel
    target: {strategies: [{label: "Search: Name"}]}
  screen:
    - {role: textbox, name: Search by Name}
    - {role: button, name: Search}
    - {role: link, name: Advanced Search}
  expect: {pick: [Search by Name]}

- id: field-renamed
  step:
    action: fill
    intent: Enter the last name
    value: Smith
    target: {strategies: [{label: Last Name}]}
  screen:
    - {role: textbox, name: First Name}
    - {role: textbox, name: Surname}
    - {role: textbox, name: Middle Name}
  expect: {pick: [Surname]}

